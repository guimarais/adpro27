[project]
name = "adpro-class-02"
version = "0.1.0"
description = "Reproducible, maintainable Python projects"
requires-python = ">=3.11"
dependencies = ["ipykernel>=6,<8", "pydantic>=2,<3"]

[dependency-groups]
dev = ["nbclient>=0.10,<1", "nbconvert>=7,<8", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
