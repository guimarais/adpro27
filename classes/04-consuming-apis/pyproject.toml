[project]
name = "adpro-class-04"
version = "0.1.0"
description = "Simple HTTP clients, a supplied FastAPI service, and AI API previews"
requires-python = ">=3.11"
dependencies = ["ipykernel>=6,<8", "pydantic>=2,<3", "requests>=2.32,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pytest>=8,<10"]

[dependency-groups]
dev = ["nbclient>=0.10,<1", "nbconvert>=7,<8", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
